name: Daily rankings sync

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rankings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Import Marin Burger Club rankings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing from GitHub Actions secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 --max-time 180 \
            "https://burgernom-turbocode.rudyntech.workers.dev/api/cron/sync" \
            -H "Authorization: Bearer $CRON_SECRET"
